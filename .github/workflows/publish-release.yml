name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path

          module = ast.parse(Path("app.py").read_text(encoding="utf-8"))
          version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "APP_VERSION"
                  for target in node.targets
              )
          )
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(
                  f"Release tag must be v{version}, got {os.environ['RELEASE_TAG']}"
              )
          PY
      - name: Prepare update assets
        run: |
          mkdir -p dist
          cp app.py dist/app.py
          sha256sum dist/app.py | cut -d ' ' -f1 > dist/app.py.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/app.py dist/app.py.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
